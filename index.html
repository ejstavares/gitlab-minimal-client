<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitLab - Minimal Dashboard</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ═══════════════ HEADER ═══════════════ -->
<header>
  <svg class="header-logo" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M22.65 14.39L12 22.13 1.35 14.39a.84.84 0 0 1-.3-.94l1.22-3.78 2.44-7.51A.42.42 0 0 1 4.82 2a.43.43 0 0 1 .58 0 .42.42 0 0 1 .11.18l2.44 7.49h8.1l2.44-7.51A.42.42 0 0 1 18.6 2a.43.43 0 0 1 .58 0 .42.42 0 0 1 .11.18l2.44 7.51L23 13.45a.84.84 0 0 1-.35.94z"/>
  </svg>

  <nav class="breadcrumb" aria-label="Navigation">
    <span class="breadcrumb-home" onclick="goHome()" data-i18n="app_title">GitLab - Minimal Dashboard</span>
    <span class="breadcrumb-sep" id="breadSep" style="display:none" aria-hidden="true">/</span>
    <span class="breadcrumb-project" id="breadProject"></span>
  </nav>

  <div class="header-actions">
    <div class="lang-switcher" id="langSwitcher" role="group" aria-label="Language"></div>
    <button class="btn btn-ghost btn-sm icon-btn" id="themeBtn"
      onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">☀️</button>
    <button class="btn btn-ghost btn-sm" onclick="openConfig()" data-i18n="btn_projects">⚙️ Projetos</button>
  </div>
</header>

<!-- ═══════════════ CONFIG MODAL ═══════════════ -->
<div class="modal-overlay" id="configModal" role="dialog" aria-modal="true" aria-labelledby="cfgModalTitle">
  <div class="modal">
    <div class="modal-header">
      <h2 id="cfgModalTitle" data-i18n="cfg_title">Configuração</h2>
      <button class="modal-close" onclick="closeConfig()" aria-label="Close">✕</button>
    </div>

    <div class="field">
      <label for="cfgUrl" data-i18n="cfg_base_url">GitLab Base URL</label>
      <input type="url" id="cfgUrl" placeholder="https://gitlab.com">
    </div>

    <div class="section-divider">
      <span data-i18n="cfg_projects_section">Projetos</span>
      <button class="btn btn-primary btn-sm" onclick="addProjectRow()" data-i18n="cfg_add_project">+ Adicionar projeto</button>
    </div>

    <div class="config-project-list" id="cfgProjectList"></div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeConfig()" data-i18n="cfg_cancel">Cancelar</button>
      <button class="btn btn-primary" onclick="saveConfig()" data-i18n="cfg_save">Salvar</button>
    </div>
  </div>
</div>

<!-- ═══════════════ HOME SCREEN ═══════════════ -->
<main class="screen active" id="screenHome">
  <div class="main">
    <div id="homeEmpty" class="empty-state" style="margin-top:40px">
      <div class="icon">🔧</div>
      <div data-i18n="home_no_projects">Nenhum projeto configurado</div>
      <button class="btn btn-primary" style="margin-top:14px" onclick="openConfig()" data-i18n="home_configure_now">Configurar agora</button>
    </div>

    <div id="homeContent" style="display:none">
      <div class="home-header">
        <div>
          <div class="home-title" data-i18n="home_title">Projetos</div>
          <div class="home-subtitle" id="homeSubtitle"></div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="refreshHome(this)" data-i18n="home_refresh_all">↺ Atualizar todos</button>
      </div>
      <div class="projects-list" id="projectsList"></div>
    </div>
  </div>
</main>

<!-- ═══════════════ PROJECT SCREEN ═══════════════ -->
<section class="screen" id="screenProject" aria-label="Project detail">
  <div class="project-screen-header">
    <div class="project-screen-avatar" id="projAvatar" aria-hidden="true"></div>
    <div class="project-screen-info">
      <div class="project-screen-name" id="projName"></div>
      <div class="project-screen-id"   id="projMeta"></div>
    </div>
    <div class="project-screen-actions">
      <span class="project-header-status status-unknown" id="projStatusBadge">—</span>
      <button class="btn btn-ghost btn-sm" onclick="refreshProject()" data-i18n="btn_refresh">↺ Refresh</button>
      <button class="btn btn-ghost btn-sm" onclick="goHome()"          data-i18n="btn_back">← Voltar</button>
    </div>
  </div>

  <div class="tabs-bar" role="tablist">
    <div class="tab active" role="tab" onclick="switchProjTab('commits',   this)" data-i18n="tab_commits">Commits</div>
    <div class="tab"        role="tab" onclick="switchProjTab('pipelines', this)" data-i18n="tab_pipelines">Pipelines</div>
  </div>

  <div class="tab-pane active" id="pane_commits"   role="tabpanel"></div>
  <div class="tab-pane"        id="pane_pipelines" role="tabpanel"></div>
</section>

<!-- ═══════════════ DETAIL PANEL ═══════════════ -->
<div class="overlay-bg" id="overlayBg" onclick="closeDetail()" aria-hidden="true"></div>

<aside class="detail-panel" id="detailPanel" aria-label="Pipeline detail">
  <div class="detail-header">
    <span aria-hidden="true">🔀</span>
    <span class="detail-title" id="detailTitle">Pipeline</span>
    <span id="detailBadge"></span>
    <button class="btn btn-ghost btn-sm" id="detailRefreshBtn"
      onclick="refreshDetail()" style="margin-left:auto;margin-right:6px"
      data-i18n="detail_refresh">↺ Refresh</button>
    <button class="detail-close" onclick="closeDetail()" aria-label="Close">✕</button>
  </div>
  <div class="detail-body" id="detailBody"></div>
</aside>

<!-- ═══════════════ FOOTER ═══════════════ -->
<footer class="app-footer">
  <span>© <span id="footerYear"></span> <a href="https://github.com/ejstavares" target="_blank" rel="noopener">ejstavares</a></span>
  <span class="footer-sep">·</span>
  <a href="https://github.com/ejstavares/gitlab-minimal-client" target="_blank" rel="noopener">gitlab-minimal-client</a>
</footer>

<!-- ═══════════════ SCRIPTS ═══════════════ -->
<!-- Load order matters: state first, app last -->
<script src="js/state.js"></script>
<script src="js/helpers.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script src="js/config.js"></script>
<script src="js/home.js"></script>
<script src="js/project.js"></script>
<script src="js/detail.js"></script>
<script src="js/app.js"></script>
<script>document.getElementById('footerYear').textContent = new Date().getFullYear();</script>

</body>
</html>
